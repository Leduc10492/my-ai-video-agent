# 镜头语法库：按“这一刻在戏里起什么作用”来查，给导演 agent 选镜头组用。
# 每条是一套常用切法，不是硬规定。导演 agent 要写清楚这部片为什么用、哪里改了。
# 切点：什么事件发生时切到下一镜（参考 Virtual Cinematographer 的习语写法）。
# cut：成片里每镜大概留多久；生成时每镜仍按 2–4 秒生成，剪的时候再截。

英雄登场·广告式:
  用在: 一个被包装出来的英雄第一次亮相；观众应该觉得“好看但假”
  本片用法: 赵凯。越完美越好，后面才有反差
  镜头组:
    - {size: 大特写, frame: 脚, angle: 低机位, speed: 升格, cut: 1.0, 拍: 脚落地}
    - {size: 全景, angle: 仰拍, move: 缓慢上升, cut: 1.5, 拍: 站起}
    - {size: 中景, angle: 微仰, speed: 升格, cut: 1.5, 拍: 招牌动作（甩披风、整理手套）}
    - {size: 中景, angle: 高机位, cut: 1.0, 拍: 群众反应，挑一个具体的人}
    - {size: 近景, angle: 仰拍, move: 缓慢推近, cut: 1.5, 拍: 表情顶点（微笑、看镜头）}
  切点: 每个动作做完的瞬间切；升格镜头等动作到顶点再切
  注意: 升格镜头里不放对口型台词；群众反应至少有一个具体的人，不要只拍人群

真英雄时刻·反广告式:
  用在: 真正的英雄行为，和上面形成对照
  本片用法: 江北推开人群、碎片悬停。不给仰拍、不给闪光灯、不给欢呼
  镜头组:
    - {size: 全景, angle: 平拍, move: 手持跟拍, cut: 2.0, 拍: 动作本身，不美化}
    - {size: 近景, angle: 平拍, cut: 2.0, 拍: 被救的人的眼睛}
    - {size: 中景, speed: 升格, cut: 3.0, 拍: 危险停在半空，主角背对危险}
  切点: 少切；动作做完不急着切，留半秒余韵
  注意: 声音做减法；主角不看镜头

只有一个人看见危险:
  用在: 危险正在发生，周围人都没注意
  本片用法: 江北看见玻璃开裂
  镜头组:
    - {size: 近景, cut: 1.5, 拍: 看见的人的反应（先拍他看）}
    - {size: 全景, pov: 看见的人, cut: 2.5, 拍: 他看见的东西（再拍他看见的）}
    - {size: 全景, cut: 2.0, 拍: 其他人背对危险、看着别处，危险在背景里}
  切点: 他的视线一停住，就切到他看见的东西
  注意: 第三个镜头的危险必须在画面里但不在焦点上

反转揭示·安静:
  用在: 一句话或一个物件让主角意识到事情不对
  本片用法: “你演得不像他。”和群演表
  镜头组:
    - {size: 近景, cut: 2.0, 拍: 说出反转的人，平静}
    - {size: 特写, frame: 手, cut: 1.0, 拍: 主角身体上的停顿（枪口垂下），代替脸上的表情}
    - {size: 特写, frame: 证据物件, cut: 1.5, 拍: 证据}
    - {size: 近景, cut: 2.0, 拍: 证据和现实的对照（表上写女 45 岁，怀里是年轻男人）}
  切点: 证据一出现就切，不等人物反应完
  注意: 证据先给，结论后给，让观众自己算出来

对白交锋·正反打:
  用在: 两个人一来一回
  镜头组:
    - {size: 中景, cut: 2.0, 拍: 双人关系镜头，交代谁在哪}
    - {size: 近景, cut: 按台词, 拍: A 说话，B 的肩在前景}
    - {size: 近景, cut: 按台词, 拍: B 说话，A 的肩在前景}
  切点: 换人说话时切；听的人有反应时可以提前切到听的人
  注意: 两个机位在轴线同一侧；一句台词一个对口型镜头

群众翻转:
  用在: 群众的态度在一瞬间改变
  本片用法: 欢呼变嘘声
  镜头组:
    - {size: 特写, frame: 手机屏幕, cut: 1.5, 拍: 群众看到的“版本”}
    - {size: 中景, cut: 1.0, 拍: 一个具体的人愣住}
    - {size: 全景, cut: 1.5, 拍: 整片人开始嘘}
  切点: 屏幕内容看清就切到人；那个具体的人一愣，就切全景
  注意: 先拍他们看到的，再拍反应
