# 舞台层：这两场戏的物理世界，只写一次。
# 不写镜头。时间单位是秒（舞台时间，不是成片时间）。
# 坐标：俯视图，单位米。门的中心是原点；y > 0 是门外广场，y < 0 是银行大厅；玻璃幕墙在 y = 0。
# 画幅：成片的画面比例，分镜草图和景别换算都按它来。
# src：这条事件对应剧本切分里的哪个编号（悬念窗口等检查要用），可以不写。
# 群体（人群）可写 span：相对 at 的左右范围（米），rows：几排；分镜草图和可见性都按它算。
# 朝向 face：门外 / 大厅 / 某个人的名字 / 一个坐标点。人物自己的左右由朝向推出来，不用写。

title: EP001 SC003–SC004 银行
画幅: "9:16"
space:
  zones:
    大厅: {when: "y < 0", ref: "@REF-BANK-HALL", kind: 室内}
    广场: {when: "y >= 0", ref: "@REF-PLAZA", kind: 室外}
  fixtures:
    玻璃幕墙: {line: [[-10, 0], [10, 0]], h: 4.5, note: 整面落地玻璃，中间是双开玻璃门}
    大门: {line: [[-1.2, 0], [1.2, 0]], h: 2.6}
    警戒线: {line: [[-8, 6], [8, 6]], h: 1.0, note: 黄色警戒线}
  # 主轴：从“从”看向“到”，机位分左右两侧。提示词会写机位在哪一侧
  主轴: {从: [0, -10], 到: [0, 12], 名: 银行大厅 → 广场}

cast:
  江北: {ref: "@JIANGBEI", look: 黑狼面具，黑色反派戏服}
  人质: {ref: "@HEYU", look: 二十多岁的年轻男人，浅色衬衫}
  小女孩: {ref: "@DOUDOU", look: 黄色雨衣, h: 1.15}
  妈妈: {ref: "@DOUDOU-MOM"}
  赵凯: {ref: "@ZHAOKAI", look: 白金配色英雄宣传服，披风}
  人群: {ref: "@CROWD", group: true, look: 几十个围观者，举着手机}
  商务车: {ref: "@VAN", object: true, look: 白色商务车}

props:
  枪: 塑料道具枪
  群演表: 贴在江北左手腕内侧的小卡片
  碎片: 幕墙的玻璃碎片

timeline:
  # ───────── SC003 ─────────
  - t: 0
    scene: SC003
    set:
      江北: {at: [0, -4], face: 门外, 左手: 从背后勒住人质脖子, 右手: 握枪，枪口朝门外}
      人质: {at: [-0.25, -3.7], face: 门外, pose: 背贴江北胸口，头在江北头的左侧，双手垂下}
      人群: {at: [0, 8], span: [-8, 3], rows: 3, face: 大厅, pose: 挤在警戒线外}
      小女孩: {at: [0.5, 6.6], face: 大厅, pose: 站在第一排正中，被妈妈牵着左手}
      妈妈: {at: [1.1, 6.9], face: 大厅, 右手: 举着手机}
      商务车: {at: [18, 10], face: [0, 10], pose: 还在街口，画面外}
    state: {玻璃幕墙: 完整, 大门: 关闭, 面具: 江北戴着, 枪: 江北右手, 群演表: 江北左手腕内侧, 人质: 在场}

  - {t: 0, dur: 4, act: {who: 人群, do: 举着手机，屏幕对着银行，有人踮脚}}
  - {t: 0, dur: 4, overlay: "直播弹幕：来了来了！ / 赵凯今天几分钟搞定？ / 黑狼又来送人头 哈哈哈"}
  - {t: 4, dur: 3, act: {who: 小女孩, do: 踮起脚往银行里看}}
  - {t: 7, dur: 4, hold: 江北, note: 保持劫持姿势一动不动}
  - {t: 7, dur: 4, sound: {who: 导演, via: 耳麦, line: "赵凯堵车了，还要两分钟。江北，拖时间！加戏！"}}
  - {t: 11, dur: 3, say: {who: 江北, to: 门外, line: "都别过来！谁过来我就——"}}
  - {t: 14, dur: 3, say: {who: 人质, to: 江北, line: "你演得不像他。", note: 嘴贴江北左耳，语气平静}}
  - {t: 17, dur: 2, act: {who: 江北, do: 枪口停住，往下垂了一点}}
  - {t: 19, dur: 2, say: {who: 江北, to: 人质, line: "……什么？", note: 头稍向左转，小声}}
  - {t: 21, dur: 2, hold: 人质, note: 不回答，嘴闭着，眼睛看前方}
  - {t: 23, dur: 3, act: {who: 江北, do: 低头，看自己左手腕内侧，左臂仍勒着人质，不抬手}}
  - {t: 26, dur: 2, overlay: "群演表：第 3 场人质：群演 07 号，女，45 岁。", on: 群演表, note: 卡片上的字后期合成}
  - {t: 28, dur: 3, hold: 人质, note: 本场揭示交给镜头：观众看清他是二十多岁的男人}

  # ───────── SC004 ─────────
  - {t: 31, dur: 2, scene: SC004, act: {who: 江北, do: 抬起视线，看向玻璃幕墙}}
  - {t: 33, dur: 5, src: A09, change: {玻璃幕墙: 下半部布满裂纹}, how: 裂纹从幕墙下缘无声地往上爬，一块接一块；玻璃保持平直，不弯曲}
  - {t: 38, dur: 3, move: {who: 商务车, to: [5, 11], face: [0, 11]}, note: 白色商务车开到人群后面停下}
  - {t: 41, dur: 2, act: {who: 人群, do: 转身看车，欢呼，手机转向车}}
  - {t: 41, dur: 2, set: {人群: {face: 商务车}, 小女孩: {face: 商务车}, 妈妈: {face: 商务车}}}
  # 赵凯登场：重点时刻，舞台写到脚落地、站起、甩披风、微笑这一级
  - {t: 43, dur: 0, set: {赵凯: {at: [4.2, 10.4], face: 大厅, pose: 坐在车后座，侧滑门刚打开}}}
  - {t: 43, dur: 2, act: {who: 赵凯, do: 右脚踏出车门，白金色战靴踩到地面}}
  - {t: 43, dur: 8, act: {who: 人群, do: 欢呼，闪光灯连成一片, ambient: true}}
  - {t: 45, dur: 2, act: {who: 赵凯, do: 起身站直，下车, pose_after: 站在车门外，背挺得很直}}
  - {t: 45, dur: 2, move: {who: 赵凯, to: [4.2, 9.6], face: 大厅}, same_action: true}
  - {t: 47, dur: 2, act: {who: 赵凯, do: 右手一甩，披风向后展开, pose_after: 披风在身后展开}}
  - {t: 47, dur: 2, act: {who: 小女孩, do: 拉着妈妈的手跳起来挥手}}
  - {t: 49, dur: 2, act: {who: 赵凯, do: 看向人群，露出自信的微笑, pose_after: 面带自信的微笑}}
  - {t: 51, dur: 3, change: {玻璃幕墙: 整面布满裂纹}, how: 裂纹继续往上爬，爬到幕墙顶部；玻璃仍然平直}
  - {t: 51, dur: 3, move: {who: 赵凯, to: [2, 6.4], face: 大厅}, note: 大步走向警戒线，人群让开一条路}
  - {t: 54, dur: 3, move: {who: 赵凯, to: [0.4, -3.0], face: 江北}, note: 跨过警戒线，推开大门，冲到江北面前}
  - {t: 54, dur: 4, sound: {who: 导演, via: 耳麦, line: "好！赵凯进场！江北，三、二、一，倒！"}}
  - {t: 55, dur: 0, change: {大门: 敞开}}
  - {t: 57, dur: 2, act: {who: 赵凯, do: 挥出右拳，拳头停在离江北半米处, uses: 右手}}
  - {t: 59, dur: 2, act: {who: 江北, do: 视线越过赵凯，看向门外警戒线第一排}}
  - {t: 61, dur: 3, sound: {who: 老孙, via: 闪回, line: "看见了也当没看见。"}}
  - {t: 64, dur: 2, sound: {who: 导演, via: 耳麦, line: "江北！倒！！"}}
  - {t: 61, dur: 5, hold: 江北, note: 站着不倒}
  - {t: 66, dur: 2, act: {who: 江北, do: 松开左臂，把人质往自己右后方推开, releases: 左手}}
  - {t: 66, dur: 2, move: {who: 人质, to: [-0.9, -4.8], face: 门外}, note: 踉跄退开, same_action: true}
  - {t: 68, dur: 2, move: {who: 江北, to: [0.3, -3.3], face: 门外, releases: 右手}, note: 扔下枪，冲向赵凯}
  - {t: 68, dur: 0, change: {枪: 掉在大厅地上}}
  - {t: 70, dur: 2, act: {who: 江北, do: 右肩撞在赵凯胸口}}
  - {t: 70, dur: 2, move: {who: 赵凯, to: [0.5, 1.5], face: 大厅}, note: 被撞出大门，仰面倒在门外地上, same_action: true}
  - {t: 72, dur: 0, set: {赵凯: {pose: 仰面倒在门外地上}}}
  - {t: 72, dur: 3, move: {who: 江北, to: [0, 5.4], face: 人群}, note: 冲出大门，跑到警戒线前，背对银行}
  - {t: 75, dur: 2, act: {who: 江北, do: 张开双臂，把第一排人群往后推}}
  - {t: 75, dur: 2, move: {who: 小女孩, to: [0.5, 7.4], face: 江北}, note: 被推着后退, same_action: true}
  - {t: 72, dur: 3, set: {人群: {face: 江北}, 妈妈: {face: 江北}}}
  - {t: 75, dur: 2, set: {人群: {at: [0, 9]}}}
  - {t: 77, dur: 2, src: A18, change: {玻璃幕墙: 碎裂下落}, how: 整面幕墙同时碎裂，碎片朝门外落下}
  - {t: 79, dur: 3, change: {碎片: 悬停在江北背后一臂距离}, how: 慢镜头，无数碎片停在江北背后半空，不动}
  - {t: 80, dur: 0, exit: 人质, note: 人质在没有人看的时候离开，任何镜头都不能拍到这个过程}
  - {t: 82, dur: 2, act: {who: 小女孩, do: 抬头看着江北的眼睛}}
  - {t: 84, dur: 2, change: {碎片: 落在空地上, 玻璃幕墙: 只剩空框, 大门: 只剩门框}, how: 碎片全部落在空无一人的地上，现实速度恢复}
  - {t: 86, dur: 2, overlay: "手机直播画面：反派黑狼偷袭赵凯，然后银行玻璃碎了", note: 后期用 C16、C21 的素材合成进手机屏幕}
  - {t: 88, dur: 2, act: {who: 妈妈, do: 盯着手里的手机屏幕，停住不动, needs: 正面}}
  - {t: 90, dur: 2, act: {who: 人群, do: 发出嘘声，有人朝江北指, needs: 正面}}
  - {t: 92, dur: 2, act: {who: 江北, do: 回头，看向大厅}}
  - {t: 92, dur: 2, set: {江北: {face: 大厅}}}
  - {t: 94, dur: 3, hold: 江北, note: 大厅里空无一人，没有人质}
