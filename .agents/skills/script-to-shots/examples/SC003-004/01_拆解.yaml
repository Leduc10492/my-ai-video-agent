# 拆解：剧本转分镜的第 2–4 步。人审的就是这个文件（审片页里会排成表）。
# 编号来自 00_剧本切分.txt：S 场景，A 动作段，D 对白，I 插入。
# 类：交代 / 动作 / 停顿 / 视线 / 揭示 / 构图要求 / 声音 / 插入，一句可以有多个。
# 要：这句对镜头的义务，只写看得见、听得见的东西，不写情绪词。
# 同框：构图要求专用。列出必须同时在一个画面里的人或场景固定物，“名字:正面”表示还要求朝向。编译器会验证。
# 可省：true 表示这条义务允许没有镜头认领（要写原因）。

剧本: 剧本.fountain
目标时长: 96

义务:
  A01: {类: [交代], 要: 广场全景，警戒线和人群同框}
  I01: {类: [插入], 要: 手机屏幕特写，弹幕后期合成}
  A02: {类: [交代], 要: 小女孩单独一镜，黄雨衣清楚，站第一排}
  A03: {类: [交代], 要: 江北首次出场，看得见面具、勒人质的手臂和枪}
  D01: {类: [声音], 要: 画面给江北，导演不出镜}
  D02: {类: [对白], 要: 江北对口型，朝门外喊}
  D03: {类: [对白, 揭示], 要: 人质对口型，平静}
  A04: {类: [停顿], 要: 江北的枪口停住，至少 1.5 秒没有别的动作}
  D04: {类: [对白], 要: 江北对口型，小声}
  A05: {类: [停顿], 要: 人质嘴闭着，不回答}
  A06: {类: [视线], 要: 江北低头看手腕}
  I02: {类: [插入, 揭示], 要: 群演表特写，字后期合成}
  A07: {类: [揭示], 要: 紧接 I02，人质的脸，看得出是二十多岁的男人}
  A08: {类: [视线], 要: 江北抬眼}
  A09: {类: [视线, 动作, 声音], 要: 江北看见的玻璃，裂纹往上爬，没有碎裂声}
  A10: {类: [动作], 要: 车停下；人群转身}
  A11: {类: [构图要求], 要: 人群的脸朝车，裂开的玻璃在背景里, 同框: [人群, 玻璃幕墙]}
  A12: {类: [动作], 要: 下车、甩披风、摆姿势，各一镜}
  D05: {类: [声音], 要: 画面给江北或冲过来的赵凯}
  A13: {类: [动作], 要: 赵凯冲进门；挥拳停在半米外}
  A14: {类: [构图要求], 要: 江北、玻璃、玻璃外的人群和小女孩在同一个画面里，看得出玻璃正对着她, 同框: [江北, 玻璃幕墙, 人群, 小女孩]}
  D06: {类: [声音], 要: 画面给江北的脸，嘴闭着}
  D07: {类: [声音], 要: 江北仍然不动}
  A15: {类: [停顿], 要: 江北站着不倒，留够时间}
  A16: {类: [动作], 要: 推开人质、冲上去、撞出大门，各一镜}
  A17: {类: [动作], 要: 江北张开双臂推人，平拍}
  A18: {类: [动作], 要: 玻璃爆裂，碎片朝门外落}
  A19: {类: [构图要求], 要: 江北的背和悬停的碎片同框，距离看得出, 同框: [江北, 玻璃幕墙]}
  A20: {类: [视线], 要: 江北的脸；小女孩的眼睛（特写）}
  A21: {类: [停顿], 要: 悬停至少一秒不剪}
  A22: {类: [动作], 要: 碎片落在空地上}
  I03: {类: [插入], 要: 人群的手机屏幕，画面是黑狼偷袭赵凯}
  A23: {类: [停顿, 动作], 要: 一个具体的人愣住；整片人嘘}
  A24: {类: [视线], 要: 江北回头}
  A25: {类: [视线, 构图要求], 要: 人质原来站的地方，空的}

节拍:
  - {名: 开场交代, 从: A01, 到: A03, 价值: 无, 重量: 1, 秒: 8}
  - {名: 人质反转, 从: D01, 到: A07, 价值: 一切按剧本 → 这场戏是假的, 知道: [观众, 江北], 重量: 2, 秒: 21, 拍法: 反转揭示·安静}
  - {名: 玻璃开裂, 从: A08, 到: A09, 价值: 安全 → 危险, 知道: [观众, 江北], 重量: 2, 秒: 7, 拍法: 只有一个人看见危险}
  - {名: 赵凯登场, 从: A10, 到: A13, 价值: 无（对照组）, 重量: 2, 秒: 21, 拍法: 英雄登场·广告式}
  - {名: 江北的决定, 从: A14, 到: A15, 价值: 服从 → 反抗, 知道: [观众, 江北], 重量: 3, 秒: 7}
  - {名: 救人, 从: A16, 到: A22, 价值: 危险 → 得救, 知道: [观众, 江北], 重量: 3, 秒: 20, 拍法: 真英雄时刻·反广告式}
  - {名: 群众翻转, 从: I03, 到: A25, 价值: 英雄 → 被当成坏人, 知道: [观众], 重量: 2, 秒: 10, 拍法: 群众翻转}

悬念:
  - {从: A09, 到: A18, 危险: 玻璃幕墙, 观众和谁知道: [江北], 谁不知道: [赵凯, 人群, 导演]}
